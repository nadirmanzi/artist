services:
  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
      args:
        # Resolved from the root .env (artist/.env), not frontend/.env —
        # Compose only substitutes ${VAR} here from the file next to this
        # compose.yml itself.
        PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL}
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped


  nginx:
      image: nginx:1.25-alpine
      ports:
        - "80:80"
      volumes:
        - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
        - static_data:/app/staticfiles:ro
        - media_data:/app/media:ro
      depends_on:
        - backend
        - frontend

volumes:
  postgres_data:
  static_data:
  media_data:

