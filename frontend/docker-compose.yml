services:
  app-dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles: ["dev"]

  app:
    build:
      context: .
      target: runner
    ports:
      - "5173:5173"
    restart: unless-stopped
    profiles: ["prod"]